<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fashion World | Корзина</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tai+Heritage+Pro:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="announcement">Оформите заказ до 18:00 — отправка в тот же день</div>
  <header class="site-header">
    <div class="logo">Fashion World</div>
    <div class="header_links">
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="catalog.html">Каталог</a>
        <a href="women.html">Women</a>
        <a href="men.html">Men</a>
      </nav>
    </div>
    <div class="header-actions">
      <a class="nav-profile" href="profile.html">Профиль</a>
      <a href="cart.html">Корзина (<span data-cart-count>0</span>)</a>
    </div>
    <div class="hamburger" id="hamburger"><p>☰</p></div>
  </header>
  <div class="mobile-menu" id="mobileMenu">
    <aside class="mobile-menu-content">
      <a href="#" class="close-btn" id="closeMenu">&times;</a>
      <a href="index.html">Home</a>
      <a href="catalog.html">Каталог</a>
      <a class="nav-profile" href="profile.html">Профиль</a>
      <a href="cart.html">Корзина</a>
    </aside>
  </div>

  <main id="cartPage">
    <section class="section">
      <div class="section-header">
        <span>Корзина</span>
        <a href="catalog.html">Продолжить покупки</a>
      </div>

      <p id="cartEmpty" class="muted" style="display:none;">Корзина пуста. Добавьте товары из каталога.</p>
      <div id="cartItems" class="cart-list"></div>

      <div class="cart-summary">
        <div class="promo-box">
          <label for="promoCode">Промокод</label>
          <div class="promo-row">
            <input type="text" id="promoCode" placeholder="Например, FASHION10" maxlength="20">
            <button type="button" class="button" id="applyPromo">Применить</button>
          </div>
          <p id="promoMessage" class="promo-msg"></p>
          <p class="muted" style="font-size:12px;">Доступные коды для теста: FASHION10, VOGUE15, MARGIELA</p>
        </div>
        <div class="total-box">
          <span>Итого</span>
          <strong id="cartTotal">0 ₽</strong>
          <button type="button" class="button" id="checkoutBtn">Оформить заказ</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p style="font-size:12px;color:var(--muted);">Fashion World © <span data-year></span></p>
  </footer>
  <script src="script.js"></script>
  <script src="shop.js"></script>
</body>
</html>
